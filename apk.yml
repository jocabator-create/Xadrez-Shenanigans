name: Gerar APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Baixar o Stockfish 18 (WASM) para dentro do app
        run: |
          cd app/src/main/assets
          B=https://github.com/nmrugg/stockfish.js/releases/download/v18.0.0
          # apague um par de linhas da lista se quiser um APK menor
          for f in stockfish-18-lite-single.js stockfish-18-lite-single.wasm stockfish-18-single.js stockfish-18-single.wasm stockfish-18.js stockfish-18.wasm; do
            curl -fL --retry 3 -o "$f" "$B/$f"
          done
          ls -lh
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: xadrez-apk
          path: app/build/outputs/apk/debug/app-debug.apk
