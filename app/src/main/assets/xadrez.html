<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xadrez Acadêmico</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e8edf2;--ink:#1d2f40;--l:#d6dee6;--d:#5f7f9a;--hi:#f2c94c;--btn:#24506f;--card:#fff;--mut:#52626f;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14202b;--ink:#e6edf3;--card:#1f3040;--btn:#3b6f95;--mut:#a3b5c4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14202b;--ink:#e6edf3;--card:#1f3040;--btn:#3b6f95;--mut:#a3b5c4;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px}
h1{font:700 28px/1.15 Georgia,"Times New Roman",serif;margin:18px 0 4px}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
button{font:inherit;border:0;border-radius:8px;padding:12px 14px;background:var(--btn);color:#fff;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.b{display:block;width:100%;margin:0 0 10px;text-align:left}
.g{background:transparent;color:var(--ink);border:1px solid var(--mut)}
.it{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);margin:0 0 8px;border:1px solid rgba(95,127,154,.4)}
.it small{display:block;color:var(--mut)}
.top{background:var(--btn);color:#fff;border-radius:8px;padding:10px 12px;font-size:14px}
.top.rush{background:#b45309}
.st{margin:8px 0;font-size:15px;min-height:2.9em}
.row{display:flex;gap:8px}.row button{flex:1}
.bd{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:min(100%,540px);aspect-ratio:1/1;margin:8px auto;border-radius:4px;overflow:hidden;user-select:none;-webkit-user-select:none}
.sq{display:flex;align-items:center;justify-content:center;position:relative;min-width:0;min-height:0;overflow:hidden;font-size:clamp(22px,8vw,46px);line-height:1;cursor:pointer}
.sq.l{background:var(--l)}.sq.d{background:var(--d)}
.sq.sel{background:var(--hi)}
.sq.last{box-shadow:inset 0 0 0 3px rgba(242,201,76,.75)}
.sq.mv::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(242,201,76,.95)}
.sq.mv.cp::after{width:86%;height:86%;background:none;border:3px solid var(--hi)}
.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 1px #000}
.k{color:#101c28}
.sq.bm{box-shadow:inset 0 0 0 3px #2e8b57}
.eb{height:10px;border-radius:5px;background:#1c2b38;overflow:hidden;margin:6px 0}.eb i{display:block;height:100%;background:#f4f7fa}
.al{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:240px;overflow:auto;margin:8px 0}.al .it{margin:0;padding:8px 10px;font-size:14px}
.a0{border-left:5px solid #2e8b57}.a1{border-left:5px solid #b08900}.a2{border-left:5px solid #c2570c}.a3{border-left:5px solid #c0392b}.it.on{outline:2px solid var(--hi)}
.logo{display:block;height:64px;margin:14px 0 0}
</style></head><body><div id="app"></div>
<script>
const G={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟\uFE0E'},VL={P:100,N:320,B:330,R:500,Q:900,K:0};
const ST='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const C=[
{t:'Armadilha de Legal (Defesa Philidor)',c:'Armadilhas clássicas',d:'Sacrifício de dama que termina em xeque-mate com peças menores.',m:'e2e4 e7e5 g1f3 d7d6 f1c4 c8g4 b1c3 g7g6 f3e5 g4d1 c4f7 e8e7 c3d5'},
{t:'Armadilha Arca de Noé (Abertura Espanhola)',c:'Armadilhas clássicas',d:'As pretas prendem o bispo de Ruy Lopez com os peões da ala da dama.',m:'e2e4 e7e5 g1f3 b8c6 f1b5 a7a6 b5a4 d7d6 d2d4 b7b5 a4b3 c6d4 f3d4 e5d4 d1d4 c7c5 d4d5 c8e6 d5c6 e6d7 c6d5 c5c4'},
{t:'Gambito Evans (Abertura Italiana)',c:'Gambitos e armadilhas',d:'Sacrifício de peão em b4 para ganhar tempo e dominar o centro.',m:'e2e4 e7e5 g1f3 b8c6 f1c4 f8c5 b2b4 c5b4 c2c3 b4a5 d2d4'},
{t:'Defesa dos Dois Cavalos (contra a Italiana)',c:'Contra-ataques ideais',d:'Contra-ataque imediato sobre e4 em vez de defesa passiva.',m:'e2e4 e7e5 g1f3 b8c6 f1c4 g8f6'},
{t:'Defesa Berlinesa (contra a Ruy Lopez)',c:'Contra-ataques ideais',d:'A “Muralha de Berlim”: solidez difícil de furar.',m:'e2e4 e7e5 g1f3 b8c6 f1b5 g8f6'},
{t:'Gambito Alien (Caro-Kann)',c:'Gambitos e armadilhas',d:'Sacrifício Cxf7 na Caro-Kann para abrir o rei preto.',m:'e2e4 c7c6 d2d4 d7d5 b1c3 d5e4 c3e4 g8f6 e4g5 h7h6 g5f7'},
{t:'Gambito Halloween',c:'Gambitos e armadilhas',d:'Sacrifício de cavalo logo na abertura para criar caos tático.',m:'e2e4 e7e5 g1f3 b8c6 b1c3 g8f6 f3e5'},
{t:'Gambito ICBM (variante Stafford)',c:'Gambitos e armadilhas',d:'Linha agressiva do Gambito Stafford, toda em contra-ataque.',m:'e2e4 e7e5 g1f3 g8f6 f3e5 b8c6 e5c6 d7c6 d2d3 f8c5 c1g5 f6e4'}
].map(x=>({...x,m:x.m.split(' ')}));
const PZ=[
{t:'Mate em 1',h:'Brancas jogam e dão xeque-mate.',f:'r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4',s:'h5f7'},
{t:'Mate de corredor',h:'Brancas jogam e dão xeque-mate.',f:'6k1/5ppp/8/8/8/8/5PPP/R5K1 w - - 0 1',s:'a1a8'},
{t:'Garfo de cavalo',h:'Ataque rei e torre ao mesmo tempo.',f:'4k3/1r6/8/1N6/8/8/8/4K3 w - - 0 1',s:'b5d6'},
{t:'Cravada',h:'Prenda o cavalo ao rei com o bispo.',f:'3qk3/3n4/8/8/8/8/4B3/4K3 w - - 0 1',s:'e2b5'},
{t:'Afogamento',h:'Force o empate: deixe o rei preto sem lances e sem xeque.',f:'k7/7Q/1K6/8/8/8/8/8 w - - 0 1',s:'h7c7'}
];
const fen=f=>{const[p,t,c,e]=f.split(' '),b=[];for(const ch of p){if(ch==='/')continue;if(/\d/.test(ch))for(let i=0;i<+ch;i++)b.push(' ');else b.push(ch)}return{b,t,c:c==='-'?'':c,ep:e&&e!=='-'?(8-e[1])*8+e.charCodeAt(0)-97:-1}};
function atk(b,sq,by){const r=sq>>3,c=sq&7,w=by==='w',U=x=>w?x:x.toLowerCase(),g=(R,C)=>R>=0&&R<8&&C>=0&&C<8?b[R*8+C]:'#',pr=r+(w?1:-1);
 if(g(pr,c-1)===U('P')||g(pr,c+1)===U('P'))return 1;
 for(const[d,e]of[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]])if(g(r+d,c+e)===U('N'))return 1;
 for(let d=-1;d<2;d++)for(let e=-1;e<2;e++){if(!d&&!e)continue;if(g(r+d,c+e)===U('K'))return 1;let R=r+d,C=c+e,x;while((x=g(R,C))===' '){R+=d;C+=e}if(x===U('Q')||x===U(d&&e?'B':'R'))return 1}
 return 0}
function gen(s){const{b,t,c,ep}=s,w=t==='w',o=[],mine=p=>p!==' '&&(p<'a')===w;
 for(let i=0;i<64;i++){const p=b[i];if(!mine(p))continue;const r=i>>3,k=i&7,q=p.toUpperCase();
  const to=(R,C)=>{if(R<0||R>7||C<0||C>7)return 0;const x=b[R*8+C];if(mine(x))return 0;o.push({f:i,t:R*8+C});return x===' '};
  if(q==='P'){const d=w?-1:1,pr=w?0:7,R=r+d,pu=(T,e)=>o.push({f:i,t:T,e:e,p:(T>>3)===pr});
   if(b[R*8+k]===' '){pu(R*8+k);if(r===(w?6:1)&&b[(R+d)*8+k]===' ')o.push({f:i,t:(R+d)*8+k})}
   for(const e of[-1,1]){const C=k+e;if(C<0||C>7)continue;const T=R*8+C,x=b[T];if(x!==' '&&!mine(x))pu(T);else if(T===ep)pu(T,1)}}
  else if(q==='N')for(const[d,e]of[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]])to(r+d,k+e);
  else{for(let d=-1;d<2;d++)for(let e=-1;e<2;e++){if(!d&&!e)continue;if(q==='K')to(r+d,k+e);else if(q==='Q'||(q==='B')===!!(d&&e)){let R=r+d,C=k+e;while(to(R,C)){R+=d;C+=e}}}
   if(q==='K'){const h=w?56:0,en=w?'KQ':'kq',ot=w?'b':'w';
    if(i===h+4&&!atk(b,i,ot)){
     if(c.includes(en[0])&&b[h+5]===' '&&b[h+6]===' '&&!atk(b,h+5,ot))o.push({f:i,t:h+6});
     if(c.includes(en[1])&&b[h+1]===' '&&b[h+2]===' '&&b[h+3]===' '&&!atk(b,h+3,ot))o.push({f:i,t:h+2})}}}}
 return o}
function make(s,m){const b=s.b.slice(),p=b[m.f],q=p.toUpperCase();let ep=-1,c=s.c;
 if(m.e)b[m.t+(s.t==='w'?8:-8)]=' ';
 b[m.t]=m.p?(s.t==='w'?'Q':'q'):p;b[m.f]=' ';
 if(q==='K'&&Math.abs(m.t-m.f)===2){const a=m.t>m.f?[m.f+3,m.f+1]:[m.f-4,m.f-1];b[a[1]]=b[a[0]];b[a[0]]=' '}
 if(q==='P'&&Math.abs(m.t-m.f)===16)ep=(m.f+m.t)/2;
 for(const sq of[m.f,m.t]){const x={0:'q',4:'kq',7:'k',56:'Q',60:'KQ',63:'K'}[sq];if(x)for(const ch of x)c=c.replace(ch,'')}
 return{b,t:s.t==='w'?'b':'w',c,ep}}
const inChk=s=>atk(s.b,s.b.indexOf(s.t==='w'?'K':'k'),s.t==='w'?'b':'w');
const legal=s=>gen(s).filter(m=>{const n=make(s,m);return!atk(n.b,n.b.indexOf(s.t==='w'?'K':'k'),n.t)});
const mu=m=>'abcdefgh'[m.f&7]+(8-(m.f>>3))+'abcdefgh'[m.t&7]+(8-(m.t>>3));
const mv=(s,u)=>{const f=(8-u[1])*8+u.charCodeAt(0)-97,t=(8-u[3])*8+u.charCodeAt(2)-97;return legal(s).find(m=>m.f===f&&m.t===t)};
function ev(s){let v=0;for(let i=0;i<64;i++){const p=s.b[i];if(p===' ')continue;const q=p.toUpperCase(),w=p<'a',r=i>>3,c=i&7;
 const x=VL[q]+(q==='P'?(w?6-r:r-1)*6:q==='K'?0:(7-Math.abs(2*c-7)/2-Math.abs(2*r-7)/2)*4);v+=w?x:-x}return v}
function nm(s,d,a,b){const L=legal(s);if(!L.length)return inChk(s)?-1e5-d:0;if(!d)return ev(s)*(s.t==='w'?1:-1);
 L.sort((x,y)=>(s.b[y.t]!==' ')-(s.b[x.t]!==' '));
 for(const m of L){const v=-nm(make(s,m),d-1,-b,-a);if(v>=b)return b;if(v>a)a=v}return a}
// estado e aprendizado
let L={g:0,w:0,l:0,d:0,m:{}};try{L=JSON.parse(localStorage.getItem('xadrez-ia'))||L}catch(e){}
const save=()=>{try{localStorage.setItem('xadrez-ia',JSON.stringify(L))}catch(e){}};
let view='menu',S,H=[],sel=-1,LM=[],last=null,msg='',li=0,pz=0,rp=0,score=0,AIm=[],over=0,busy=0,rz=0;
function learnEnd(r){L.g++;r>0?L.w++:r<0?L.l++:L.d++;for(const a of AIm){const o=L.m[a.k]||(L.m[a.k]={}),e=o[a.u]||(o[a.u]=[0,0,0]);e[r<0?0:r>0?1:2]++}AIm=[];save()}
function newGame(){sfCb=null;S=fen(ST);H=[];sel=-1;LM=[];last=null;AIm=[];over=0;busy=0;msg='Sua vez (brancas).'}
function end(){if(legal(S).length)return 0;const mate=inChk(S);over=1;busy=0;msg=mate?(S.t==='b'?'Xeque-mate! Você venceu.':'Xeque-mate. A IA venceu.'):'Afogamento: empate.';learnEnd(mate?(S.t==='b'?1:-1):0);draw();return 1}
function aiMove(){if(SFok)return sfGo();const Lg=legal(S),k=S.b.join('')+S.t,mem=L.m[k]||{};let best=null,bv=-1e9;
 for(const m of Lg){const u=mu(m),e=mem[u]||[0,0,0],n=e[0]+e[1]+e[2],v=-nm(make(S,m),2,-1e9,1e9)+(n?60*(e[0]-e[1])/(n+1):0)+Math.random()*8;if(v>bv){bv=v;best=m}}
 fin(best)}
function fin(m){AIm.push({k:S.b.join('')+S.t,u:mu(m)});H.push({S,last});S=make(S,m);last=m;busy=0;if(end())return;msg='Sua vez.'+(inChk(S)?' Você está em xeque.':'');draw()}
// Stockfish WASM (Worker): stockfish-18-lite-single.js + .wasm na mesma pasta do HTML
let SF=null,SFok=0,SFst='Carregando Stockfish…',LV=10,sfCb=null;
function toFen(s){let f='';for(let r=0;r<8;r++){let n=0;for(let c=0;c<8;c++){const p=s.b[r*8+c];if(p===' ')n++;else{if(n)f+=n;n=0;f+=p}}if(n)f+=n;if(r<7)f+='/'}
 return f+' '+s.t+' '+(s.c||'-')+' '+(s.ep<0?'-':'abcdefgh'[s.ep&7]+(8-(s.ep>>3)))+' 0 1'}
function sfOff(t){SFok=0;SFst='Motor interno ('+t+')';if(view==='menu')draw()}
function loadSF(){try{const w=new Worker('stockfish-18-lite-single.js'),t=setTimeout(()=>{if(!SFok){w.terminate();sfOff('Stockfish não carregou')}},20000);
 w.onerror=()=>{clearTimeout(t);sfOff('arquivos do Stockfish não encontrados')};
 w.onmessage=e=>{const l=String(e.data);
  if(l==='uciok')w.postMessage('isready');
  else if(l==='readyok'&&!SFok){clearTimeout(t);SF=w;SFok=1;SFst='Stockfish WASM';if(view==='menu')draw()}
  else if(l.startsWith('bestmove')&&sfCb){const cb=sfCb;sfCb=null;cb(l.split(' ')[1])}};
 w.postMessage('uci')}catch(e){sfOff('Stockfish indisponível aqui')}}
function sfGo(){sfCb=u=>{const m=u&&mv(S,u);if(!m){sfOff('Stockfish falhou');return aiMove()}fin(m)};
 SF.postMessage('setoption name Skill Level value '+LV);SF.postMessage('position fen '+toFen(S));SF.postMessage('go movetime 700')}
function move(m){H.push({S,last});S=make(S,m);last=m;
 if(view==='play'){if(end())return;busy=1;msg='A IA está pensando…';draw();setTimeout(aiMove,80)}else rc(m)}
function clk(i){if((view!=='play'&&view!=='rush')||busy||over)return;const p=S.b[i];
 if(sel>=0){const m=LM.find(x=>x.f===sel&&x.t===i);if(m){sel=-1;LM=[];return move(m)}}
 if(p!==' '&&p<'a'){sel=i;LM=legal(S).filter(x=>x.f===i)}else{sel=-1;LM=[]}draw()}
function undo(){if(busy)return;if(view==='play'){if(over||H.length<2)return;H.pop();({S,last}=H.pop());AIm.pop();msg='Lance desfeito.'}else if(H.length){({S,last}=H.pop())}sel=-1;LM=[];draw()}
function offer(){if(busy||over)return;if(-ev(S)<150){over=1;msg='Empate por acordo.';learnEnd(0)}else msg='A IA recusou o empate.';draw()}
function rs(){const p=PZ[rp];S=fen(p.f);H=[];last=null;sel=-1;LM=[];busy=0;msg=p.h}
function rc(m){if(mu(m)===PZ[rp].s){score+=100;busy=1;msg='Acertou! +100 pontos.';draw();setTimeout(()=>{rp=(rp+1)%PZ.length;rs();draw()},1200)}else{({S,last}=H.pop());msg='Não é esse. Tente de novo.';draw()}}
function sn(d){const n=C[pz].m.length;li=Math.max(0,Math.min(n,li+d));S=fen(ST);last=null;msg='';
 for(let j=0;j<li;j++){const m=mv(S,C[pz].m[j]);if(!m){msg='Lance inválido no catálogo: '+C[pz].m[j];li=j;break}last=m;S=make(S,m)}
 if(!msg)msg=li?`Lance ${li} de ${n}`+(li===n?' — variante concluída.':'.'):'Posição inicial.';draw()}
function go(x){view=x;sel=-1;LM=[];rz=0;draw()}
function bd(){let h='<div class="bd">';for(let i=0;i<64;i++){const p=S.b[i],m=LM.find(x=>x.t===i);

 const c=[...(self.crossOriginIsolated?[['stockfish-18.js','Stockfish 18 multi-thread',45000]]:[]),['stockfish-18-single.js','Stockfish 18 completo',45000],['stockfish-18-lite-single.js','Stockfish 18 lite',15000]];
 for(const[f,n,t]of c){const w=await openW(f,t);if(w){AN=w;anName=n;break}}
 if(AN&&/multi/.test(anName))AN.postMessage('setoption name Threads value '+Math.min(8,navigator.hardwareConcurrency||2));
 if(!AN)anName='motor interno (fraco)'}
function evalP(s){const n=legal(s);if(!n.length)return Promise.resolve({cp:inChk(s)?(s.t==='w'?-1500:1500):0,best:''});
 if(!AN)return new Promise(r=>setTimeout(()=>{let b=null,bv=-1e9;for(const m of n){const v=-nm(make(s,m),2,-1e9,1e9);if(v>bv){bv=v;b=m}}r({cp:Math.max(-1500,Math.min(1500,bv*(s.t==='w'?1:-1))),best:mu(b)})},20));
 return new Promise(r=>{let sc=null;AN.onmessage=e=>{const l=String(e.data);
  if(l.startsWith('info')&&/ score /.test(l)&&!/bound/.test(l)){const m=l.match(/score (cp|mate) (-?\d+)/);if(m)sc=m}
  else if(l.startsWith('bestmove')){const g=s.t==='w'?1:-1,v=sc?+sc[2]:0;r({cp:sc?(sc[1]==='cp'?Math.max(-1500,Math.min(1500,v*g)):g*(v>0?1:-1)*1500):0,mate:sc&&sc[1]==='mate'?v*g:0,best:l.split(' ')[1]})}};
 AN.postMessage('position fen '+toFen(s));AN.postMessage('go movetime '+anT)})}
async function runAN(id){for(let i=0;i<P.length&&id===anRun;i++){msg=`Analisando posição ${i+1} de ${P.length} com ${anName}`;draw();const r=await evalP(P[i]);if(id!==anRun)return;E[i]=r;goA(ai)}
 if(id===anRun){msg='Análise concluída.';draw()}}
function anStart(){if(busy)return;P=[...H.map(h=>h.S),S];M=[...H.slice(1).map(h=>h.last),last];
 if(P.length<2){msg='Jogue ao menos um lance para analisar.';return draw()}
 SV={S,last,msg};E=[];ai=P.length-1;bmk=null;view='ana';const id=++anRun;msg='Carregando o analista… arquivos grandes podem demorar.';draw();
 loadAN().then(()=>{if(id===anRun)runAN(id)})}
function goA(i){ai=Math.max(0,Math.min(P.length-1,i));S=P[ai];last=ai?M[ai-1]:null;const e=E[ai],m=e&&e.best&&mv(P[ai],e.best);bmk=m||null;draw()}
function exitA(){anRun++;AN&&AN.postMessage('stop');S=SV.S;last=SV.last;msg=SV.msg;bmk=null;view='play';draw()}
function reA(){AN&&AN.postMessage('stop');E=[];const id=++anRun;runAN(id)}
function cls(i){const a=E[i],b=E[i+1];if(!a||!b)return null;const l=Math.max(0,P[i].t==='w'?a.cp-b.cp:b.cp-a.cp);
 return mu(M[i])===a.best||l<=15?['Melhor',0,l]:l<=50?['Bom',0,l]:l<=120?['Imprecisão',1,l]:l<=300?['Erro',2,l]:['Gafe',3,l]}
const f2=e=>!e?'…':e.mate?'M'+Math.abs(e.mate):(e.cp>0?'+':'')+(e.cp/100).toFixed(2);
function sumA(){if(E.filter(Boolean).length<P.length)return'';const t=[[0,0,0],[0,0,0]];for(let i=0;i<M.length;i++){const c=cls(i),k=i%2;t[k][0]+=c[2];if(c[1]===2)t[k][1]++;if(c[1]===3)t[k][2]++}
 return['Brancas','Pretas'].map((n,k)=>`${n}: perda média ${Math.round(t[k][0]/Math.max(1,Math.ceil((M.length-k)/2)))} cp, ${t[k][1]} erros, ${t[k][2]} gafes`).join('<br>')}
function anH(){const e=E[ai],cp=e?e.cp:0,pct=50+50*(2/(1+Math.exp(-cp/400))-1);
 return `<div class="top">Análise: ${anName||'carregando…'}</div>${bd()}<div class="eb" title="Vantagem das brancas"><i style="width:${pct}%"></i></div>
<div class="st">${msg}<br>Posição ${ai} de ${P.length-1}: ${f2(e)}${e&&e.best?'. Melhor lance: '+e.best:''}<br>${sumA()}</div>
<div class="row"><button onclick="goA(ai-1)">◀ Anterior</button><button onclick="goA(ai+1)">Próxima ▶</button></div>
<div class="al">${M.map((m,i)=>{const c=cls(i);return `<button class="it a${c?c[1]:''}${i+1===ai?' on':''}" onclick="goA(${i+1})">${i%2?'':(i/2+1|0)+'. '}${mu(m)}<small>${c?c[0]+' ('+(c[2]/100).toFixed(2)+')':'…'}</small></button>`}).join('')}</div>
<p class="sub">Tempo por posição <select onchange="anT=+this.value*1000">${[1,3,6].map(n=>`<option${n*1000===anT?' selected':''}>${n}</option>`).join('')}</select> s <button class="g" onclick="reA()">Reanalisar</button></p>
<button class="g" style="width:100%" onclick="exitA()">Voltar ao jogo</button>`}
loadSF();draw();
</script></body></html>
